<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic document metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>HTML Links</title>
</head>

<body>

    <!-- Main page heading -->
    <h1>HTML Links</h1>

    <!-- External website link -->
    <p>
        Visit
        <a href="https://www.google.com">Google</a>
        to search the web.
    </p>

    <!-- Another external link -->
    <p>
        Visit my
        <a href="https://github.com">GitHub</a>
        profile.
    </p>

    <!-- Links to pages within the same website -->
    <h2>Website Pages</h2>

    <a href="index.html">Home</a>
    <br>

    <a href="about.html">About</a>
    <br>

    <a href="contact.html">Contact</a>

    <!-- Link to a page inside a folder -->
    <h2>More Pages</h2>

    <a href="pages/services.html">Our Services</a>

    <!-- Going one folder up -->
    <p>
        <a href="../index.html">Back to Main Page</a>
    </p>

    <!-- Same-page section link -->
    <h2 id="courses">Courses</h2>

    <p>
        We offer several programming courses.
    </p>

    <!-- Link that jumps to the Courses section -->
    <p>
        <a href="#courses">Go to Courses</a>
    </p>

    <!-- Email link -->
    <h2>Contact</h2>

    <p>
        <a href="mailto:student@example.com">
            Email Us
        </a>
    </p>

    <!-- Phone link -->
    <p>
        <a href="tel:+923001234567">
            Call Us
        </a>
    </p>

    <!-- Opening an external link in a new tab -->
    <p>
        <a href="https://www.example.com" target="_blank">
            Visit Example Website
        </a>
    </p>

    <!-- Link used for navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</body>

</html>

<!DOCTYPE html>
<!-- Tells the browser that this is a modern HTML document -->

<html>

<head>
    <!-- Contains information about the webpage -->

    <title>Student Portfolio</title>
    <!-- Title displayed in the browser tab -->
</head>

<body>
    <!-- Contains the actual visible content of the webpage -->

    <h1>Welcome to My Portfolio</h1>
    <!-- Main heading of the webpage -->

    <p>
        This is a simple HTML page created to demonstrate
        the basic structure of an HTML document.
    </p>
    <!-- Paragraph containing introductory text -->

    <h2>About Me</h2>
    <!-- A second-level heading -->

    <p>
        I am a software engineering student learning
        web development.
    </p>
    <!-- Another paragraph -->

</body>

</html>
<!-- End of the HTML document -->

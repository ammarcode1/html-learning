<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML CSS JS Connection</title>

    <!-- Connect the external CSS file to the HTML document -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HTML provides the structure and content of the page -->

    <h1 id="main-heading" class="heading">
        Welcome to My Website
    </h1>

    <p class="description">
        HTML provides the structure of the page.
    </p>

    <button id="action-button">
        Click Me
    </button>


    <!-- Connect the external JavaScript file to the HTML document -->
    <script src="script.js"></script>

</body>

</html>

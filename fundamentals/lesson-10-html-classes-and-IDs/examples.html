<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes and IDs</title>
</head>
<body>

    <!--
        CLASS:
        class reusable.
    -->

    <h1 class="main-heading">Student Dashboard</h1>

    <p class="description">
        Welcome to the student dashboard.
    </p>

    <p class="description">
        Here you can check your courses and progress.
    </p>


    <!--
        ID: id normally unique.
    -->

    <section id="courses">
        <h2>My Courses</h2>

        <p class="course">Database Systems</p>
        <p class="course">Data Structures</p>
        <p class="course">Linear Algebra</p>
    </section>


    <!--
        Same element can have BOTH id and class.
        id = unique identity
        class = reusable group
    -->

    <section id="profile" class="section">
        <h2 class="section-heading">My Profile</h2>
        <p class="description">BS Software Engineering Student</p>
    </section>


    <!--
        One element can have multiple classes.
    -->

    <div class="card featured">
        <h2 class="card-title">Featured Project</h2>
        <p class="description">Library Management System</p>
    </div>


    <!--
        Same-page link
    -->

    <a href="#courses">Go to Courses</a>

</body>
</html>

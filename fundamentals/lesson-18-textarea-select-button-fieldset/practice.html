<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Library Membership Form</title>
</head>
<body>
    <h1>University Library Membership Form</h1>

    <hr>

    <form action="/form" method="post">

        <fieldset>

            <legend>Personal Information</legend>

            <br>

            <label for="username">Enter ur Name: </label>
            <input type="text" id="username" name="username" placeholder="eg. Ammar">

            <br><br>

            <label for="email">Email: </label>
            <input type="email" name="email" id="email" placeholder="ammar@gmail.com">

        </fieldset>

        <fieldset>

            <legend>Library Information</legend>

            <br>

            <h4>Membership Type</h4>

            <select name="member" id="member">

                <option value="regular" selected>Regular Member</option>
                <option value="premium">Premium Member</option>
                <option value="research">Research Member</option>

            </select>

            <h4>Prefered Book Category</h4>

            <select name="book" id="book">

                <option value="pf">Programming</option>
                <option value="db">Database</option>
                <option value="se">Software Engineering</option>
                <option value="math">Mathematics</option>

            </select>

            <br><br>

            <label for="join">Why do u want to join Library?</label>
            <textarea name="join" id="join" placeholder="Type here...." rows="5" cols="40"></textarea>

        </fieldset>
        
        <br><br>

        <button type="submit">Apply for Membership</button>
        <button type="reset">Clear Form</button>

    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Fundamentals</title>
</head>

<body>

    <h1>Registration Form</h1>

    <!-- The form collects user information -->
    <form action="/register" method="post">

        <!-- Connect the label to the input using for and id -->
        <label for="full-name">Full Name:</label>
        <input
            type="text"
            id="full-name"
            name="full-name"
            placeholder="Enter your full name"
        >

        <br><br>

        <!-- The name attribute identifies the field during submission -->
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
        >

        <br><br>

        <!-- The value attribute provides an initial value -->
        <label for="country">Country:</label>
        <input
            type="text"
            id="country"
            name="country"
            value="Pakistan"
        >

        <br><br>

        <!-- A submit input sends the form data -->
        <input type="submit" value="Register">

    </form>


    <hr>


    <h2>Search Form</h2>

    <!-- GET is commonly used when the submitted data can appear in the URL -->
    <form action="/search" method="get">

        <label for="search">Search:</label>
        <input
            type="text"
            id="search"
            name="query"
            placeholder="Search something..."
        >

        <input type="submit" value="Search">

    </form>

</body>
</html>

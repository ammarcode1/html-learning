<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Course Registration Form</title>
</head>
<body>
    <form action="/register" method="post">
        <label for="studentName">
            Enter Student Name:
        </label>
        <input type="text" id="studentName" name="username" placeholder="eg. Ammar">
        <br><br>
        <label for="stdID">Enter your ID:</label>
        <input type="text" id="stdID" name="id" placeholder="L1F24BSSE0364">

        <br><br>
        <label for="dept">Department Name:</label>
        <input type="text" id="dept" name="dept" value="Software Engineering">

        <br><br>
        <label for="sem">Enter your Semester:</label>
        <input type="text" id="sem" name="semes" placeholder="5th">

        <br><br>
        <input type="submit" value="Register Course">
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video and iframe Examples</title>
</head>
<body>

    <h1>Media Examples</h1>

    <!-- Example of adding a local audio file -->
    <h2>Audio</h2>

    <audio controls>
        <source src="assets/AUD-20260120-WA0020.opus" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>


    <!-- Example of adding a local video file -->
    <h2>Video</h2>

    <video controls width="600">
        <source src="assets/video.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>


    <!-- Example of embedding external content using iframe -->
    <h2>Embedded Website</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/18tvsvlc5Og?si=yy2uVMicvkbGEOLK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    <!-- Example of embedding a YouTube video -->
    <h2>YouTube Video</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/18tvsvlc5Og?si=yy2uVMicvkbGEOLK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>

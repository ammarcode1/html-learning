<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic document metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>HTML Images</title>
</head>

<body>

    <!-- Main page heading -->
    <h1>My Image Gallery</h1>

    <!-- Image from the same folder as this HTML file -->
    <h2>Profile</h2>

    <img
        src="profile.jpg"
        alt="Profile photo"
        width="300"
        height="300"
    >

    <!-- Image located inside an images folder -->
    <h2>My Workspace</h2>

    <img
        src="images/workspace.jpg"
        alt="Laptop on a workspace"
        width="500"
        height="300"
    >

    <!-- Image from a parent folder -->
    <h2>University</h2>

    <img
        src="../university.jpg"
        alt="University building"
        width="500"
        height="300"
    >

    <!-- Decorative image with empty alt text -->
    <img
        src="images/decoration.png"
        alt=""
        width="100"
        height="100"
    >

    <!-- Image loaded from an external URL -->
    <h2>External Image</h2>

    <img
        src="https://example.com/photo.jpg"
        alt="Example photo"
        width="400"
        height="250"
    >

</body>

</html>

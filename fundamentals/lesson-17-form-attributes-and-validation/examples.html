<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Examples</title>
</head>

<body>

    <h1>Student Registration</h1>

    <form action="/register" method="post">

        <!-- Required text field with minimum and maximum length -->
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            minlength="3"
            maxlength="20"
            required
        >

        <br><br>

        <!-- Required email field -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <!-- Number field with minimum and maximum allowed values -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required
        >

        <br><br>

        <!-- Number field with specific increments -->
        <label for="gpa">GPA:</label>
        <input
            type="number"
            id="gpa"
            name="gpa"
            min="0"
            max="4"
            step="0.01"
        >

        <br><br>

        <!-- Readonly field cannot be edited by the user -->
        <label for="department">Department:</label>
        <input
            type="text"
            id="department"
            name="department"
            value="Software Engineering"
            readonly
        >

        <br><br>

        <!-- Disabled field cannot be interacted with -->
        <label for="student-status">Status:</label>
        <input
            type="text"
            id="student-status"
            name="status"
            value="Active Student"
            disabled
        >

        <br><br>

        <!-- Text field with a specific format -->
        <label for="student-id">Student ID:</label>
        <input
            type="text"
            id="student-id"
            name="student-id"
            placeholder="Example: L1F24BSSE0364"
            pattern="[A-Z0-9]+"
        >

        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
